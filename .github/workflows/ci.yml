name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a failed run be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check below diffs against the base branch, and a
          # shallow clone does not contain it at any depth.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # A release needs either a changeset or a deliberate empty one. Catching
      # that on the PR is much cheaper than noticing after merge.
      - name: Changeset present
        # The release PR is the one PR that legitimately has none, because
        # versioning consumes them. Checking it there would fail every release.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The site consumes the published package like any other dependency, so it
      # no longer needs the sibling build. That is also what lets Vercel build it
      # straight from the repo with no configuration.
      - run: pnpm install --frozen-lockfile
        working-directory: site
      # `pnpm typecheck`, not `tsc` directly: the docs collection is generated, and
      # the script is what guarantees it exists first.
      - run: pnpm typecheck
        working-directory: site
      - run: pnpm build
        working-directory: site
