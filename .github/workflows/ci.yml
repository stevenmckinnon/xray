name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a failed run be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check below diffs against the base branch, and a
          # shallow clone does not contain it at any depth.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The playgrounds are workspace members, so one install covers them and they
      # can be type-checked. The Vite one never was, which is how `<shadow-card>`
      # went untyped and the plugin's own config sat behind a cast.
      - run: pnpm --filter xray-playground typecheck
      - run: pnpm --filter xray-playground-next typecheck

      # And built, which is not the same check. `tsc` is happy with a `next.config`
      # that Turbopack refuses to compile — a wrong `outputFileTracingRoot` type-checks
      # perfectly and then cannot resolve `next` itself. This is the step that runs
      # `withXray` through a real bundler.
      #
      # Both bundlers, because each catches a different half of the guard that keeps
      # the client out of a production build: Turbopack notices a runtime value in the
      # condition, webpack notices an `import()` after an early return. Each build
      # ends in an assertion over its own output. ~4s and ~9s.
      - run: pnpm --filter xray-playground-next build
      - run: rm -rf playground-next/.next
      - run: pnpm --filter xray-playground-next build:webpack

      # A release needs either a changeset or a deliberate empty one. Catching
      # that on the PR is much cheaper than noticing after merge.
      - name: Changeset present
        # The release PR is the one PR that legitimately has none, because
        # versioning consumes them. Checking it there would fail every release.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The site consumes the published package like any other dependency, so it
      # no longer needs the sibling build. That is also what lets Vercel build it
      # straight from the repo with no configuration.
      # --ignore-workspace: a root pnpm-workspace.yaml governs every directory
      # beneath it, and site is deliberately not a member. Without this pnpm
      # installs the workspace instead and leaves site/node_modules empty, which
      # surfaces later as a missing binary rather than as a failed install.
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: site
      # `pnpm typecheck`, not `tsc` directly: the docs collection is generated, and
      # the script is what guarantees it exists first.
      - run: pnpm typecheck
        working-directory: site
      - run: pnpm build
        working-directory: site
