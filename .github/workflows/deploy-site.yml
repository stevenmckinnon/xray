name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  # Lets a failed run be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # A token carries no team context, so the CLI needs the scope spelled out
      # for a project that lives on a team. Not sensitive, hence a variable.
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      # Production on main, a preview URL on every pull request.
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      # Skip rather than fail while the secrets are still unset, so the badge
      # does not go red before the project exists.
      - name: Check configuration
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not set, so the deploy was skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      # The package must be built before the site, because the site copies
      # dist/client.js into its public assets and runs the real engine on itself.
      # Deploying a site built against a stale bundle would make the live demo
      # quietly disagree with the released tool.
      - name: Build the package
        if: steps.check.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the site
        if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: site

      # "Project not found" is what Vercel returns for a malformed id as well as
      # a missing one, so check the shape before blaming access. Lengths and
      # prefix matches are safe to print; the values themselves stay masked.
      - name: Validate Vercel configuration
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID} (expected 32)"
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID} (expected 29)"
          case "$VERCEL_PROJECT_ID" in
            prj_*) echo "project id prefix: ok" ;;
            *) echo "project id prefix: WRONG, does not start with prj_" ;;
          esac
          case "$VERCEL_ORG_ID" in
            team_*) echo "org id prefix: ok (team)" ;;
            user_*) echo "org id prefix: ok (personal)" ;;
            *) echo "org id prefix: WRONG, expected team_ or user_" ;;
          esac
          # Fail here rather than letting Vercel report "Project not found",
          # which is the same message it gives for an id it cannot see.
          ok=true
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) ok=false ;; esac
          case "$VERCEL_ORG_ID" in team_*|user_*) ;; *) ok=false ;; esac
          if [ "$ok" = false ]; then
            echo "::error::The Vercel ids are malformed. Set them from the linked project rather than by hand: gh secret set VERCEL_PROJECT_ID --body \"\$(node -p \"require('./.vercel/project.json').projectId\")\""
            exit 1
          fi

      - name: Pull Vercel environment
        if: steps.check.outputs.ready == 'true'
        run: pnpm dlx vercel@latest pull --yes --environment="$TARGET" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
        working-directory: site

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm dlx vercel@latest build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          fi
        working-directory: site

      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(pnpm dlx vercel@latest deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          else
            url=$(pnpm dlx vercel@latest deploy --prebuilt --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $TARGET to $url" >> "$GITHUB_STEP_SUMMARY"
        working-directory: site
