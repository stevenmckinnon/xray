name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a failed run be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # A release needs either a changeset or a deliberate empty one. Catching
      # that on the PR is much cheaper than noticing after merge.
      - name: Changeset present
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The site embeds the client bundle, so the package is built first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm exec tsc --noEmit
        working-directory: site
      - run: pnpm build
        working-directory: site
