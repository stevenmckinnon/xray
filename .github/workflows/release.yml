name: Release

on:
  push:
    branches: [main]
  # Lets a failed run be retried without an empty commit.
  workflow_dispatch:

# One release at a time. Two overlapping runs would race on the version PR.
concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14, and 22 resolves to the
          # latest 22.x.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates OIDC. Trusted publishing needs
      # npm >= 11.5.1, so upgrade before anything tries to publish.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Nothing ships unless the whole thing is green. `changesets/action` runs
      # after these, so a red build blocks both the version PR and the publish.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          # No npm token. Publishing authenticates with the OIDC token minted by
          # `id-token: write`, which is why npm's 2FA-bypass token deprecation
          # does not apply here. Provenance attestations come for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The site installs xray from the registry like any other consumer, and
      # both CI and the host build it with a frozen lockfile. Nothing here
      # updates that lockfile on its own, so without this step every release
      # would leave the live demo running the previous version's client.
      - name: Point the site at the new release
        if: steps.changesets.outputs.published == 'true'
        working-directory: site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `npm publish` returns before the new version is reliably readable,
          # and an install that runs too early resolves the old one and succeeds.
          for _ in $(seq 1 30); do
            npm view "@stevenmckinnon/xray@$VERSION" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "@stevenmckinnon/xray@$VERSION" version

          pnpm add -D "@stevenmckinnon/xray@^$VERSION"

      # This is the real check on the bump: the site's build copies the client
      # bundle out of the freshly installed package, so a release that breaks the
      # demo fails here rather than on the deployed site.
      - name: Build the site against the new release
        if: steps.changesets.outputs.published == 'true'
        working-directory: site
        run: |
          pnpm exec tsc --noEmit
          pnpm build

      - name: Commit the site bump
        id: site
        if: steps.changesets.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet -- site; then
            echo "The site is already on $VERSION."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package.json site/pnpm-lock.yaml
          # Deliberately no `[skip ci]`. The steps above already cover what CI
          # would check, but the host's Git integration honours that keyword too,
          # and skipping the deploy is the one thing this commit exists to do.
          git commit -m "chore: point the site at xray $VERSION"
          git push
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### xray"
            echo
            if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
              echo "Published \`${{ steps.version.outputs.version }}\` to npm."
              if [ "${{ steps.site.outputs.bumped }}" = "true" ]; then
                echo "Pointed the site at it, which deploys on push."
              else
                echo "The site was already on this version."
              fi
            else
              echo "No publish this run. Version is \`${{ steps.version.outputs.version }}\`."
              echo "If a release PR was opened or updated, merging it publishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
